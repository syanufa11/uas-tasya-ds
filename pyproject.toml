[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".agents", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/audit_samsung_health.py" = ["E501", "E701", "E702", "E731", "B905", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
