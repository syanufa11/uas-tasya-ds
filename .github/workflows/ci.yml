name: CI & Streamlit Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Test, Privacy & Streamlit Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-modeling.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-modeling.txt pytest ruff

      - name: Check Python syntax
        run: python -m compileall -q src dashboard scripts tests

      - name: Lint with Ruff
        run: ruff check .

      - name: Run unit and smoke tests (pytest)
        run: pytest -v

      - name: Validate Streamlit config and app import
        run: |
          python -c "
          import sys, tomllib
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          for cfg in ['.streamlit/config.toml', 'dashboard/.streamlit/config.toml']:
              data = tomllib.loads(Path(cfg).read_text(encoding='utf-8'))
              assert 'theme' in data, f'Missing [theme] in {cfg}'

          sys.path.insert(0, str(Path('dashboard').resolve()))
          from views import activity, methodology, overview, quality, relationship, sleep
          assert all(hasattr(v, 'render') for v in (overview, sleep, activity, relationship, quality, methodology))

          at = AppTest.from_file('dashboard/app.py')
          at.run(timeout=30)
          assert not at.exception, at.exception
          print('Streamlit config, view imports, and AppTest passed.')
          "

      - name: Check for sensitive files and credential leaks
        run: python scripts/check_privacy.py
